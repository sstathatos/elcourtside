apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "elcourtside.componentLabels" (dict "Release" .Release "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "elcourtside.componentLabels" (dict "Release" .Release "component" "api") | nindent 4 }}
  ports:
    # Named because the ServiceMonitor selects the port by name, not number.
    - name: http
      port: 8000
      targetPort: http
