apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "elcourtside.componentLabels" (dict "Release" .Release "component" "web") | nindent 4 }}
spec:
  selector:
    {{- include "elcourtside.componentLabels" (dict "Release" .Release "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
