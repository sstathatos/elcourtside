{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "elcourtside.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.backupSize }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    {{- include "elcourtside.componentLabels" (dict "Release" .Release "component" "backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "elcourtside.componentLabels" (dict "Release" .Release "component" "backup") | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      {{- include "elcourtside.componentLabels" (dict "Release" .Release "component" "api") | nindent 22 }}
          {{- with .Values.backup.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backup.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: backup
              image: "{{ .Values.backup.image.repository }}:{{ .Values.backup.image.tag }}"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  tmp="/backup/.partial-${stamp}.sqlite"
                  out="/backup/elcourtside-${stamp}.sqlite"

                  wget -q -O "$tmp" \
                    "http://{{ .Release.Name }}-api:8000/internal/backup.sqlite"

                  mv "$tmp" "$out"
                  echo "wrote $out ($(wc -c < "$out") bytes)"

                  ls -1t /backup/elcourtside-*.sqlite \
                    | tail -n +{{ add .Values.backup.retention 1 }} \
                    | while read -r old; do echo "pruning $old"; rm -f "$old"; done

                  rm -f /backup/.partial-* 2>/dev/null || true
              volumeMounts:
                - name: backup
                  mountPath: /backup
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-backup
{{- end }}
