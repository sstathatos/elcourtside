api:
  image:
    repository: ghcr.io/sstathatos/elcourtside-api
    tag: "299b2cd0510c672b4bac717166fe974ab2cc9d58"
    pullPolicy: IfNotPresent
  containerPort: 8000
  tmpSize: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

web:
  image:
    repository: ghcr.io/sstathatos/elcourtside-web
    tag: "299b2cd0510c672b4bac717166fe974ab2cc9d58"
    pullPolicy: IfNotPresent
  replicaCount: 2
  containerPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

persistence:
  storageClass: "local-path"
  size: 5Gi
  backupSize: 5Gi

ingest:
  schedule: "0 3 * * *"
  seasons: latest
  activeDeadlineSeconds: 43200

backfill:
  enabled: true
  seasons: all
  activeDeadlineSeconds: 43200

backup:
  enabled: true
  schedule: "30 4 * * *"
  nodeSelector: {}
  tolerations: []
  retention: 7
  image:
    repository: alpine
    tag: "3.22"

ingress:
  enabled: true
  className: nginx
  host: elcourtside.sstathatos.dev
  clusterIssuer: letsencrypt-prod
  tlsSecretName: elcourtside-tls
  tls: true

serviceMonitor:
  enabled: true
  interval: 30s

dashboard:
  enabled: true
