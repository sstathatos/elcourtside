# nginx for `docker compose` only — production uses web/nginx.conf.
#
# The difference is one thing: in the cluster the Ingress routes /api to the
# API service, so the web pod never sees those requests. There is no Ingress
# in compose, so this config proxies /api itself. Keeping it in a separate
# file means the production config is not carrying a dev-only upstream.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The API's own routes are already under /api, so the prefix is passed
    # through unchanged — a trailing slash on proxy_pass would strip it and
    # every call would 404.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI serves its docs at the root, not under /api, so the footer's
    # "API docs" link needs these two mapped explicitly.
    location = /api/docs {
        proxy_pass http://api:8000/docs;
    }

    location = /api/openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
