name: Build, scan, publish, deploy

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "web/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: write # the tag-bump step commits to master
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
          - name: web
            context: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the ${{ matrix.name }} test image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.test
          load: true
          tags: elcourtside-${{ matrix.name }}-test:ci
          cache-from: type=gha,scope=${{ matrix.name }}-test
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-test

      - name: Run the ${{ matrix.name }} suite
        run: docker run --rm elcourtside-${{ matrix.name }}-test:ci

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/elcourtside
      - name: Render with production values
        run: helm template elcourtside helm/elcourtside > /dev/null
      - name: Render with the kind overrides
        run: helm template elcourtside helm/elcourtside -f helm/values-kind.yaml > /dev/null

      - name: Every volumeMount resolves to a volume
        run: |
          helm template elcourtside helm/elcourtside | python3 - <<'PY'
          import sys, yaml
          bad = []
          for d in yaml.safe_load_all(sys.stdin):
              if not d or d.get("kind") not in ("CronJob", "Deployment", "Job"):
                  continue
              spec = (d["spec"]["jobTemplate"]["spec"]["template"]["spec"]
                      if d["kind"] == "CronJob" else d["spec"]["template"]["spec"])
              names = {v["name"] for v in (spec.get("volumes") or [])}
              for c in spec["containers"]:
                  for m in (c.get("volumeMounts") or []):
                      if m["name"] not in names:
                          bad.append(f'{d["metadata"]["name"]}: mount {m["name"]} has no volume')
          if bad:
              sys.exit("\n".join(bad))
          print("all volumeMounts resolve")
          PY

  build:
    needs: [test, chart]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
          - name: web
            context: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan ${{ matrix.name }} (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Report HIGH vulnerabilities (non-blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
          severity: HIGH
          exit-code: "0"

      - name: Push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin both image tags
        run: |
          python3 - "$GITHUB_SHA" <<'PY'
          import pathlib, re, sys

          sha = sys.argv[1]
          path = pathlib.Path("helm/elcourtside/values.yaml")
          lines = path.read_text().splitlines()

          section = None
          changed = 0
          for i, line in enumerate(lines):
              if re.match(r"^[a-z]", line):
                  section = line.split(":", 1)[0]
              if section in ("api", "web") and re.match(r"^    tag:", line):
                  lines[i] = f'    tag: "{sha}"'
                  changed += 1

          if changed != 2:
              sys.exit(f"expected to pin 2 tags, pinned {changed} — values.yaml shape changed")

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit the deploy
        run: |
          if git diff --quiet; then
            echo "tags unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "sstathatos"
          git config user.email "st.stathatos@gmail.com"
          git add helm/elcourtside/values.yaml
          git commit -m "chore: deploy elcourtside ${GITHUB_SHA::12} [skip ci]"
          git push
