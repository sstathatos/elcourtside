services:
  api:
    build: ./api
    user: "0:0"
    environment:
      ELCOURTSIDE_DB: /data/elcourtside.db
      ELCOURTSIDE_CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./api/data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build: ./web
    volumes:
      - ./web/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build: ./api
    profiles: ["jobs"]
    user: "0:0"
    environment:
      ELCOURTSIDE_DB: /data/elcourtside.db
    volumes:
      - ./api/data:/data
    command: ["python", "-m", "ingest", "--seasons", "latest"]

  metrics:
    build: ./api
    profiles: ["jobs"]
    user: "0:0"
    environment:
      ELCOURTSIDE_DB: /data/elcourtside.db
    volumes:
      - ./api/data:/data
    command: ["python", "-m", "metrics"]

  api-test:
    build:
      context: ./api
      dockerfile: Dockerfile.test
    profiles: ["test"]

  web-test:
    build:
      context: ./web
      dockerfile: Dockerfile.test
    profiles: ["test"]
