[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elcourtside-api"
version = "0.1.0"
description = "elcourtside — Euroleague stats: ingestion, metrics engine, API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["ingest", "ingest.sources", "metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
