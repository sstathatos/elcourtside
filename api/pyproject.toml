[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elcourtside-api"
version = "0.1.0"
description = "elcourtside — Euroleague stats: ingestion, metrics engine, API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-fastapi-instrumentator>=7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = ["ingest", "ingest.sources", "metrics", "app", "app.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
